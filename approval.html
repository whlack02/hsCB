<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실빌리자 · 교사 승인 확인</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;background:#f5f7fa;color:#172b40}section,article{background:white;padding:22px;margin:16px 0;border:1px solid #d9e0e8;border-radius:12px}label{display:block;margin:10px 0}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box;max-width:100%}input,textarea{width:100%}button{cursor:pointer;margin:5px;background:#163f65;color:white;border:0;border-radius:5px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f6;padding:15px}</style>
<h1>교실빌리자 · 교사 승인 확인</h1><p>설치 확인용 도구입니다. 실제 학생 개인정보 대신 가상 명단으로 먼저 시험하세요.</p>
<section><label>프로젝트 URL<input id="url" placeholder="https://프로젝트참조값.supabase.co"></label><label>교사 아이디<input id="login" autocomplete="username"></label><label>교사 비밀번호<input type="password" id="pw" autocomplete="current-password"></label><button id="signin">로그인</button><button id="signout">로그아웃</button><p id="user">로그인 전</p><button id="reload">담당 대기 신청 불러오기</button></section><p>담당 교사만 동의할 수 있습니다. 관리자는 전체 대기 신청 조회·거절이 가능하지만, 담당이 아니면 동의할 수 없습니다. 최대 100건을 표시합니다.</p><div id="list"></div><h2>처리 결과</h2><pre id="result" role="status">준비됨</pre>
<script>
const $=id=>document.getElementById(id);let token='',busy=false;
async function api(action,data={}){const u=$('url').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u))throw Error('프로젝트 URL을 확인하세요.');const r=await fetch(u+'/functions/v1/classroom-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data:{...data,token}})});const b=await r.json();if(!r.ok||!b.ok)throw Error(b.message||'처리 실패');return b;}
async function task(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(e){$('result').textContent=e.message;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=b.dataset.blocked==='yes');}}
function line(el,text){const p=document.createElement('p');p.textContent=text;el.append(p);}
async function load(){const b=await api('approvalList');$('list').replaceChildren();if(!b.applications.length)line($('list'),'현재 표시할 담당 대기 신청이 없습니다.');for(const a of b.applications){const box=document.createElement('article');const title=document.createElement('h2');title.textContent=a.room+' · '+a.date+' · '+a.periods.join(', ')+'교시';box.append(title);line(box,'신청번호: '+a.id);line(box,'제목: '+a.title);line(box,'사유: '+a.reason);line(box,'지도 교사: '+a.supervisor);line(box,'학생: '+a.students.map(s=>s.number+' '+s.name).join(', '));line(box,'현재 동의: '+a.agreed+' / '+a.required+'명 · 내 동의: '+(a.myDecision||'없음'));const note=document.createElement('textarea');note.placeholder='처리 메모 (선택)';box.append(note);for(const [d,label] of [['agree','동의 / 필요 수 충족 시 확정'],['reject','신청 거절']]){const btn=document.createElement('button');btn.textContent=label;if(d==='agree'&&(!a.canAgree||a.myDecision==='agree')){btn.disabled=true;btn.dataset.blocked='yes';}btn.onclick=()=>task(async()=>{if(!confirm(label+' 처리할까요?'))return;const result=await api('approvalDecide',{applicationId:a.id,decision:d,note:note.value});$('result').textContent=JSON.stringify(result,null,2);await load();});box.append(btn);}$('list').append(box);}}
$('signin').onclick=()=>task(async()=>{token='';$('list').replaceChildren();$('user').textContent='로그인 전';const b=await api('login',{loginId:$('login').value,password:$('pw').value});token=b.token;$('pw').value='';$('user').textContent=b.user.name+(b.user.isAdmin?' (관리자)':' (교사)');$('result').textContent='로그인 완료';await load();});
$('signout').onclick=()=>task(async()=>{try{if(token)await api('logout');}finally{token='';$('list').replaceChildren();$('user').textContent='로그인 전';$('result').textContent='이 화면의 로그인 정보를 지웠습니다.';}});
$('reload').onclick=()=>task(load);

try{const v=new URLSearchParams(location.search).get('project');if(v&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(v))document.getElementById('url').value=v;}catch{}
</script></html>
