<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실빌리자 로그인 설정</title><style>body{font:15px/1.7 system-ui;max-width:700px;margin:30px auto;padding:20px;background:#f5f3fa}input,select,button{font:inherit;padding:10px;box-sizing:border-box;width:100%;margin:5px 0 15px}fieldset{border:1px solid #aaa;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:15px}</style><h1>교실빌리자 · 로그인 설정</h1><p>최초 설정과 로그인 시험용입니다. 운영 화면이 아닙니다. 입력값은 저장하지 않습니다. DB 비밀번호·service_role 키는 입력하지 마세요.</p><form id="f"><label>프로젝트 URL<input id="url" type="url" required placeholder="https://…supabase.co"></label><label>작업<select id="action"><option value="bootstrap">1. 최초 관리자 생성 (한 번만)</option><option value="login">2. 로그인</option><option value="me">로그인 상태 확인</option><option value="createTeacher">3. 교사 계정 생성 (관리자 로그인 필요)</option><option value="profile">내 아이디·비밀번호 변경 (로그인 필요)</option><option value="logout">로그아웃</option></select></label><fieldset><legend>작업에 필요한 항목만 입력</legend><label>최초 설정 키 (관리자 생성 때만)<input id="secret" type="password" autocomplete="off"></label><label>이름 (계정 생성 때)<input id="name" autocomplete="off"></label><label>아이디 (로그인·계정 생성·아이디 변경 때)<input id="loginId" autocomplete="off"></label><label>비밀번호 (내 정보 변경 때 비우면 기존 비번 유지)<input id="password" type="password" autocomplete="off"></label></fieldset><button id="go">실행</button></form><pre id="out" aria-live="polite">로그인 토큰은 이 페이지 메모리에만 보관됩니다. 새로고침하면 다시 로그인해야 합니다.</pre><script>
let token='';const q=id=>document.getElementById(id);q('f').onsubmit=async e=>{e.preventDefault();try{const u=new URL(q('url').value);if(u.protocol!=='https:'||!u.hostname.endsWith('.supabase.co'))throw Error('Supabase 프로젝트 URL을 입력하세요.');q('go').disabled=true;const action=q('action').value;const r=await fetch(u.origin+'/functions/v1/classroom-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,setupSecret:action==='bootstrap'?q('secret').value:undefined,data:{token,name:q('name').value,loginId:q('loginId').value,password:q('password').value}}),signal:AbortSignal.timeout(30000)});const d=await r.json();if(d.token){token=d.token;delete d.token;}if(d.ok&&['logout','profile'].includes(action))token='';if(d.ok&&action==='bootstrap')q('secret').value='';q('out').textContent='HTTP '+r.status+'\n'+JSON.stringify(d,null,2);q('password').value='';}catch(err){q('out').textContent='오류: '+err.message;}finally{q('go').disabled=false;}};

try{const v=new URLSearchParams(location.search).get('project');if(v&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(v))document.getElementById('url').value=v;}catch{}
</script></html>
