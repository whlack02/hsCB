<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#B699F2"><title>교실빌리자 · 교실 대여 관리</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head>
<body><a class="skip" href="#main">본문으로 이동</a>

<header class="top"><a class="brand" href="#">▦ <strong>교실빌리자</strong><small>교실 대여 관리 시스템</small></a><div id="account" class="actions"></div></header>
<div class="shell"><aside class="side"><div class="side-label">WORKSPACE</div><nav aria-label="주 메뉴"><button data-view="map">▦ <span>교실 배치도</span></button><button data-view="requests">≡ <span>신청 목록</span><b id="nav-count">0</b></button><button data-view="review" class="auth" hidden>✓ <span>신청서 확인</span></button><button data-view="calendar" class="auth" hidden>▤ <span>달력으로 보기</span></button></nav><div class="side-label auth" hidden>MANAGEMENT</div><div id="tools"></div><div class="side-note"><small id="sync">연결 중…</small></div></aside>
<main id="main" tabindex="-1"><div class="page-head"><div><h1 id="page-title">교실 배치도</h1><p id="page-desc">필요한 공간을 확인하고, 간편하게 신청하세요.</p></div><div id="stats" class="stats"></div><div class="date-box"><label for="date">조회·신청 날짜</label><div class="actions"><button data-action="prev-date" aria-label="이전 날짜">‹</button><input type="date" id="date"><button data-action="next-date" aria-label="다음 날짜">›</button><button data-action="today" id="today-btn" hidden>오늘 날짜로</button></div><small id="weekday"></small></div></div>
<section id="content" aria-label="교실 현황"></section><footer class="foot"><span>교실빌리자 · 예약은 담당 선생님의 최종 승인 후 확정됩니다.</span><span>야자 1·2교시 기준</span></footer></main></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">CLASSROOM ON</div><h2 id="modal-title"></h2></div><button data-action="close" class="icon" aria-label="창 닫기">×</button></div><div id="modal-body"></div><p id="modal-error" class="error" role="alert"></p></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div><noscript>이 프로그램을 사용하려면 JavaScript를 활성화해주세요.</noscript></body></html>
