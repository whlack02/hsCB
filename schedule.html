<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실빌리자 일정 관리 확인</title>
<style>body{font-family:system-ui;max-width:960px;margin:30px auto;padding:16px;background:#f4f6f8}section,article{background:white;border:1px solid #cdd5df;border-radius:12px;padding:20px;margin:16px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}input,select{width:100%}button{cursor:pointer;margin:5px;background:#173e62;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.5}</style>
<h1>교실빌리자 · 일정 관리 확인</h1><p>설치 확인용 도구. 일반 일정 담당은 교사 본인, 관리자는 선택 가능합니다. 야자는 1학년 부장에게 자동 연결됩니다. 모든 일정은 1교시부터 선택한 종료 교시까지 점유합니다.</p>
<section><label>프로젝트 URL<input id="url" placeholder="https://프로젝트참조값.supabase.co"></label><label>아이디<input id="login" autocomplete="username"></label><label>비밀번호<input id="pw" type="password" autocomplete="current-password"></label><button id="signin">로그인·목록 불러오기</button><button id="logout">로그아웃</button><p id="user">로그인 전</p></section>
<section><h2>공통 설정</h2><label>교실<select id="room"></select></label><label>일정 제목<input id="title"></label><label>종류<select id="kind"><option value="normal">일반 일정</option><option value="night_study">야자 · 1학년 부장 자동 연결</option></select></label><label>일반 일정 담당 교사 (관리자만 선택)<select id="owner"></select></label><label>점유 교시<select id="end"><option value="1">1교시만</option><option value="2">1·2교시 모두</option></select></label></section>
<section><h2>챕터 1 · 정기 일정</h2><label>요일<select id="weekday"><option value="1">월요일</option><option value="2">화요일</option><option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option></select></label><label>시작일<input type="date" id="start"></label><label>종료일<input type="date" id="stop"></label><button id="regular">정기 일정 등록</button><p>오늘 이후 시작, 최대 366일 기간. 기존 예약·일정과 겹치면 전체 등록을 거부합니다.</p></section>
<section><h2>챕터 2 · 당일 일정</h2><label>날짜<input type="date" id="date"></label><button id="daily">당일 일정 등록</button><p>한 날짜에만 적용하는 별도 일정입니다. 기존 정기 일정을 대체하거나 취소하는 기능은 아닙니다.</p></section>
<button id="reload">일정 목록 새로고침</button><div id="list"></div><h2>처리 결과 · 저장 여부</h2><pre id="result" role="status">준비됨</pre>
<script>
const $=id=>document.getElementById(id);let token='',busy=false;
async function api(action,data={}){const u=$('url').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u))throw Error('프로젝트 URL을 확인하세요.');const c=new AbortController();const timer=setTimeout(()=>c.abort(),25000);try{const r=await fetch(u+'/functions/v1/classroom-api',{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data:{...data,token}})});const text=await r.text();let b;try{b=JSON.parse(text);}catch{throw Error(action+' 응답 형식 오류 (HTTP '+r.status+')');}if(!r.ok||!b.ok)throw Error(action+' / HTTP '+r.status+' / '+(b.message||'처리 실패'));return b;}catch(e){if(e.name==='AbortError')throw Error(action+' 응답 시간 초과. 등록 요청이었다면 저장됐을 수도 있으므로 재등록하지 말고 목록 또는 DB를 확인하세요.');throw e;}finally{clearTimeout(timer);}}

async function task(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{$('result').textContent='처리 중입니다…';await fn();}catch(e){$('result').textContent=e.message;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function options(id,rows){$(id).replaceChildren();for(const x of rows){const o=document.createElement('option');o.value=x.id;o.textContent=x.name;$(id).append(o);}}
async function load(){const b=await api('scheduleList');$('list').replaceChildren();for(const [key,label,del] of [['regular','정기 일정','regularDelete'],['daily','당일 일정','dailyDelete']]){const h=document.createElement('h2');h.textContent=label;$('list').append(h);if(!b[key].length){const p=document.createElement('p');p.textContent='등록된 일정 없음';$('list').append(p);}let last='';for(const s of b[key]){if(key==='regular'&&last!==String(s.weekday)){last=String(s.weekday);const h=document.createElement('h3');h.textContent=['','월요일','화요일','수요일','목요일','금요일'][s.weekday];$('list').append(h);}const box=document.createElement('article');const txt=document.createElement('p');txt.textContent=s.room+' · '+s.title+' · '+(s.use_date||s.starts_on+' ~ '+s.ends_on)+' · 1'+(s.end_period===2?'·2':'')+'교시 · 담당 '+(s.owner||'미배정');box.append(txt);const btn=document.createElement('button');btn.textContent='일정 삭제';btn.onclick=()=>task(async()=>{if(!confirm('이 일정을 삭제할까요?'))return;const r=await api(del,{id:s.id});$('result').textContent=r.message;await load();});box.append(btn);$('list').append(box);}}}
function common(){return {roomId:$('room').value,title:$('title').value,kind:$('kind').value,ownerId:$('owner').value,endPeriod:Number($('end').value)};}
$('signin').onclick=()=>task(async()=>{token='';$('list').replaceChildren();$('user').textContent='로그인 전';const b=await api('login',{loginId:$('login').value,password:$('pw').value});token=b.token;$('pw').value='';$('user').textContent=b.user.name+(b.user.isAdmin?' (관리자)':' (교사)');const r=await api('roomState');options('room',r.rooms);options('owner',r.teachers);$('owner').disabled=!b.user.isAdmin;if(!b.user.isAdmin)$('owner').value=b.user.id;await load();$('result').textContent='로그인 및 목록 조회 완료';});
function requireFields(mode){if(!token)throw Error('먼저 로그인하세요.');if(!$('room').value)throw Error('교실을 선택하세요.');if(!$('title').value.trim())throw Error('제목을 입력하세요.');if(!$('owner').disabled&&$('kind').value==='normal'&&!$('owner').value)throw Error('담당 교사를 선택하세요.');if(mode==='regular'&&(!$('start').value||!$('stop').value))throw Error('시작일과 종료일을 모두 입력하세요.');if(mode==='daily'&&!$('date').value)throw Error('날짜를 입력하세요.');}
async function save(mode){requireFields(mode);const regular=mode==='regular';const b=await api(regular?'regularCreate':'dailyCreate',{...common(),...(regular?{weekday:Number($('weekday').value),startsOn:$('start').value,endsOn:$('stop').value}:{date:$('date').value})});const id=b.id;const saved='DB 저장 성공 · 일정번호: '+id+'\n';$('result').textContent=saved+'목록 확인 중…';try{await load();const verify=await api('scheduleList');const found=(verify[regular?'regular':'daily']||[]).some(s=>s.id===id);$('result').textContent=saved+(found?'목록 재조회에서도 동일한 일정번호를 확인했습니다.':'목록에서 찾지 못했습니다. 다시 등록하지 말고 관리자 로그인 또는 DB 확인 SQL로 확인하세요.');}catch(e){$('result').textContent=saved+'단, 목록 조회 실패: '+e.message+'\n저장은 성공했으므로 재등록하지 마세요.';}}
$('regular').onclick=()=>task(()=>save('regular'));
$('daily').onclick=()=>task(()=>save('daily'));
$('reload').onclick=()=>task(async()=>{await load();const b=await api('scheduleList');$('result').textContent='목록 조회 성공 · 정기 '+b.regular.length+'건 / 당일 '+b.daily.length+'건 (현재 계정이 조회할 수 있는 일정)';});
$('logout').onclick=()=>task(async()=>{try{if(token)await api('logout');}finally{token='';$('list').replaceChildren();$('user').textContent='로그인 전';$('result').textContent='로그아웃';}});
const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());for(const id of ['start','stop','date']){$(id).value=today;$(id).min=today;}$('weekday').value=String(Math.min(5,Math.max(1,new Date(today+'T12:00:00').getDay())));

try{const v=new URLSearchParams(location.search).get('project');if(v&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(v))document.getElementById('url').value=v;}catch{}
</script></html>
