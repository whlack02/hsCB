<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실빌리자 교실·담당 설정</title><style>body{font:15px/1.6 system-ui;max-width:900px;margin:25px auto;padding:18px;background:#f5f3fa}input,button,select{font:inherit;padding:8px;margin:5px}input[type=url]{width:90%}article{background:white;padding:18px;margin:15px 0;border:1px solid #ddd;border-radius:12px}label{display:inline-block;margin:4px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}#login{background:#e6ddf8;padding:15px}</style><h1>교실빌리자 · 교실/담당 설정</h1><p>단계별 설치 확인용 관리자 도구입니다. 기존 교실빌리자 완성 화면은 아닙니다.</p><label>프로젝트 URL<input id="url" type="url" placeholder="https://…supabase.co"></label><section id="login"><label>관리자 아이디<input id="id" autocomplete="username"></label><label>비밀번호<input id="pw" type="password" autocomplete="current-password"></label><button id="signin">로그인</button><button id="logout">로그아웃</button><strong id="user"></strong></section><button id="load">교실 목록 불러오기</button><pre id="result" aria-live="polite"></pre><main id="rooms"></main><script>
const q=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token='',origin='',admin=false,busy=false;
async function api(action,data={}){const u=new URL(q('url').value.trim());if(u.protocol!=='https:'||!u.hostname.endsWith('.supabase.co'))throw Error('Supabase 프로젝트 URL을 입력하세요.');if(origin&&origin!==u.origin){token='';admin=false;q('user').textContent='';throw Error('프로젝트가 바뀌었습니다. 다시 로그인하세요.');}origin=u.origin;const r=await fetch(origin+'/functions/v1/classroom-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data:{...data,token}}),signal:AbortSignal.timeout(30000)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'요청 실패');return d;}
async function work(fn){if(busy)return;busy=true;q('result').textContent='처리 중…';try{await fn()}catch(e){q('result').textContent=e.message}finally{busy=false}}
q('signin').onclick=()=>work(async()=>{const d=await api('login',{loginId:q('id').value,password:q('pw').value});token=d.token;admin=d.user.isAdmin;q('pw').value='';q('user').textContent=d.user.name+(admin?' · 관리자':' · 교사');q('result').textContent='로그인 성공';await load()});q('logout').onclick=()=>work(async()=>{if(token)await api('logout');token='';admin=false;q('user').textContent='';await load();q('result').textContent='로그아웃했습니다.'});
async function load(){const d=await api('roomState');q('rooms').innerHTML=d.rooms.map(r=>`<article data-id="${esc(r.id)}"><h2>${esc(r.name)}</h2><small>기존 코드 ${esc(r.code)} / 배치 ${r.row}줄 ${r.col}번째</small><div><label>이름 <input name="name" value="${esc(r.name)}" ${admin?'':'disabled'}></label><label><input name="open" type="checkbox" ${r.open?'checked':''} ${admin?'':'disabled'}>개방</label>${[1,2].map(p=>`<label><input name="period" type="checkbox" value="${p}" ${r.periods.includes(p)?'checked':''} ${admin?'':'disabled'}>${p}교시</label>`).join('')}<label>필요 동의 수<input name="required" type="number" min="1" max="10" value="${r.required}" ${admin?'':'disabled'}></label>${admin?'<button data-action="save">교실 설정 저장</button>':''}</div><h3>담당 교사</h3>${d.teachers.slice().sort((a,b)=>Number(b.head)-Number(a.head)||a.name.localeCompare(b.name,'ko')).map(t=>`<label ${t.head?'style="border:2px solid #dab400;padding:4px;border-radius:7px"':''}><input name="teacher" type="checkbox" value="${esc(t.id)}" ${r.teachers.includes(t.id)?'checked':''} ${admin?'':'disabled'}>${esc(t.name)}${t.head?' · 1학년 부장':''}</label>`).join('')||'등록된 교사가 없습니다.'}${admin?'<p><button data-action="assign">담당 교사 저장</button></p>':''}</article>`).join('');q('result').textContent=`교실 ${d.rooms.length}개 / 교사 ${d.teachers.length}명 조회 완료. 교실 설정과 담당 교사는 각각 저장하세요.`;}
q('load').onclick=()=>work(load);q('rooms').onclick=e=>{const b=e.target.closest('button[data-action]');if(!b)return;work(async()=>{const a=b.closest('article'),roomId=a.dataset.id;let d;if(b.dataset.action==='save')d=await api('roomSave',{roomId,name:a.querySelector('[name=name]').value,open:a.querySelector('[name=open]').checked,required:Number(a.querySelector('[name=required]').value),periods:[...a.querySelectorAll('[name=period]:checked')].map(x=>Number(x.value))});else d=await api('roomAssign',{roomId,teachers:[...a.querySelectorAll('[name=teacher]:checked')].map(x=>x.value)});q('result').textContent=d.message+' 목록을 다시 불러오면 저장 내용을 확인할 수 있습니다.';});};

try{const v=new URLSearchParams(location.search).get('project');if(v&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(v))document.getElementById('url').value=v;}catch{}
</script></html>
