<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실빌리자 · 학생 신청 연결 확인</title>
<style>body{font-family:system-ui,sans-serif;max-width:850px;margin:30px auto;padding:0 18px;background:#f5f7fa;color:#172b40}section{background:white;padding:22px;margin:16px 0;border:1px solid #d9e0e8;border-radius:12px}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;box-sizing:border-box;max-width:100%}input:not([type=checkbox]),select,textarea{width:100%}button{cursor:pointer;margin:5px;background:#163f65;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f6;padding:15px}small{color:#516275}</style>
<h1>교실빌리자 · 학생 신청 확인</h1><p>설치 확인용 도구입니다. 기존 교실빌리자 완성 화면을 대체하지 않습니다.</p>
<section><label>Supabase 프로젝트 URL<input id="url" placeholder="https://프로젝트참조값.supabase.co"></label><button id="connect">교실·교사 불러오기</button><label>신청 날짜<input type="date" id="date"></label><button id="availability">교시별 가능 여부 확인</button><pre id="slots">날짜를 선택하고 확인하세요.</pre></section>
<section><h2>1. 신청</h2><p>신청은 승인 대기 상태로 저장됩니다. 담당 교사의 동의 조건을 충족하면 예약이 확정됩니다.</p><label>교실<select id="room"></select></label><label><input type="checkbox" id="p1" checked> 1교시</label><label><input type="checkbox" id="p2"> 2교시</label><label>지도 교사<select id="teacher"></select></label><label>제목<input id="title"></label><label>사용 사유<textarea id="reason"></textarea></label><label>학생 명단 (한 줄에 학번,이름)<textarea id="students" placeholder="10206,김도은&#10;10212,김호"></textarea></label><label>신청 비밀번호<input type="password" id="newpw" autocomplete="new-password"></label><p><small>승인 시 학번·이름이 공개되는 운영 방식입니다. 실제 학생 정보 입력 전 학교의 공개 기준을 확인하세요. 지금은 가상 정보로 시험하세요.</small></p><button id="create">신청 접수</button></section>
<section><h2>2. 내 신청 조회·취소</h2><label>신청번호<input id="app" autocomplete="off"></label><label>신청 비밀번호<input type="password" id="pw" autocomplete="off"></label><button id="lookup">조회</button><button id="cancel">신청 취소</button></section><h2>처리 결과</h2><pre id="result" role="status">준비됨</pre>
<script>
const $=id=>document.getElementById(id);let busy=false;
async function api(action,data={}){const u=$('url').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u))throw Error('프로젝트 URL을 확인하세요.');const r=await fetch(u+'/functions/v1/classroom-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data})});const b=await r.json();if(!r.ok||!b.ok)throw Error(b.message||'처리 실패');return b;}
function run(id,fn){$(id).onclick=async()=>{if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(e){$('result').textContent=e.message;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}};}
run('connect',async()=>{const b=await api('roomState');for(const [id,items] of [['room',b.rooms],['teacher',b.teachers]]){const select=$(id);select.replaceChildren();for(const x of items){const o=document.createElement('option');o.value=x.id;o.textContent=x.name;select.append(o);}}$('result').textContent='교실·교사 불러오기 완료';});
run('availability',async()=>{const b=await api('availability',{date:$('date').value});$('slots').textContent=b.slots.map(s=>s.name+' '+s.period+'교시: '+(s.available?'신청 가능':'신청 불가')+(s.pending?' · 대기 '+s.pending+'건':'')).join('\n');});
run('create',async()=>{const students=$('students').value.trim().split(/\n/).filter(s=>s.trim()).map(s=>{const [number,...rest]=s.split(',');return {number:number.trim(),name:rest.join(',').trim()};});const b=await api('studentCreate',{date:$('date').value,roomId:$('room').value,supervisorId:$('teacher').value,title:$('title').value,reason:$('reason').value,password:$('newpw').value,periods:[...($('p1').checked?[1]:[]),...($('p2').checked?[2]:[])],students});$('app').value=b.applicationId;$('pw').value=$('newpw').value;$('result').textContent=JSON.stringify(b,null,2);});
run('lookup',async()=>{$('result').textContent=JSON.stringify(await api('studentLookup',{applicationId:$('app').value.trim(),password:$('pw').value}),null,2);});
run('cancel',async()=>{if(!confirm('이 신청을 취소할까요?'))return;$('result').textContent=JSON.stringify(await api('studentCancel',{applicationId:$('app').value.trim(),password:$('pw').value}),null,2);});
const now=new Date();$('date').value=new Date(now.getTime()+9*3600000).toISOString().slice(0,10);

try{const v=new URLSearchParams(location.search).get('project');if(v&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(v))document.getElementById('url').value=v;}catch{}
</script></html>
